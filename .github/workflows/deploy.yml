name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📋 Print App Info
        run: |
          echo "================================================"
          echo "  App Name   : ${{ vars.NEXT_PUBLIC_APP_NAME }}"
          echo "  Owner      : ${{ vars.NEXT_PUBLIC_OWNER }}"
          echo "  Department : ${{ vars.NEXT_PUBLIC_DEPARTMENT }}"
          echo "  App URL    : ${{ vars.NEXT_PUBLIC_APP_URL }}"
          echo "  Environment: ${{ vars.NODE_ENV }}"
          echo "================================================"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build project
        run: npm run build

      - name: 🚀 Install Vercel CLI
        run: npm install -g vercel

      - name: 🔗 Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 📤 Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🎉 Deployment Successful
        run: |
          echo "================================================"
          echo "  ✅ DEPLOYMENT SUCCESSFUL!"
          echo "  🌍 Live at: ${{ vars.NEXT_PUBLIC_APP_URL }}"
          echo "  👤 Owner  : ${{ vars.NEXT_PUBLIC_OWNER }}"
          echo "================================================"
          